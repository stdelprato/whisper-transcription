[workspace]
resolver = "2"
members = ["crates/pipeline", "src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
ct2rs = "0.9"
tracing = "0.1"
